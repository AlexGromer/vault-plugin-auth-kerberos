name: ebridge-release

# Release of the e-bridge build: on a tag v*-ebridge.* — tests, reproducible linux/amd64 build,
# binary and its SHA-256 in a GitHub Release. The SHA-256 is what `vault plugin register -sha256` takes.
on:
  push:
    tags:
      - 'v*-ebridge.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'   # pinned: a local rebuild with the same Go gives the same SHA-256
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go version
          go build -trimpath -ldflags='-s -w -buildid=' -o dist/vault-plugin-auth-kerberos ./cmd/vault-plugin-auth-kerberos
          cd dist && sha256sum vault-plugin-auth-kerberos > vault-plugin-auth-kerberos.sha256 && cat vault-plugin-auth-kerberos.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/vault-plugin-auth-kerberos dist/vault-plugin-auth-kerberos.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "vault-plugin-auth-kerberos $GITHUB_REF_NAME: gokrb5 with SHA-2 PAC signature types (hmac-sha256-128, hmac-sha384-192). Build: $(go version | awk '{print $3}'), CGO_ENABLED=0, -trimpath, empty buildid. SHA-256 for vault plugin register: $(cut -d' ' -f1 dist/vault-plugin-auth-kerberos.sha256)"
